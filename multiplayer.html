<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#103d33"><title>八牌・2人対戦</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#082b25;color:#f3eddc;font-family:system-ui,sans-serif}body{min-height:100dvh}main{max-width:620px;margin:auto;padding:12px 12px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;min-height:100dvh}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0;color:#e7ca8b}a{color:#f8d998;text-decoration:none}.panel{background:#17493d;border:1px solid #356859;border-radius:12px;padding:14px}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{cursor:pointer;background:#264f43;color:#fff8e5;border:1px solid #75978a;border-radius:9px;padding:12px 15px;font-size:15px;font-weight:700;touch-action:manipulation}.btn.primary{background:#e4c275;color:#172f2a;border-color:#e4c275}.btn:disabled{opacity:.38;cursor:default}input{width:100%;padding:13px;background:#092f29;color:white;border:1px solid #8caa9d;border-radius:8px;font-size:16px}label{font-size:13px;color:#d0e2d9;display:block;margin:5px 0}.field{margin:12px 0}#status{padding:9px;border-radius:8px;background:#235849;min-height:40px}#game{display:none;flex-direction:column;gap:10px}.scores{display:flex;justify-content:space-between;text-align:center;gap:8px}.score{background:#245447;padding:9px;border-radius:9px;flex:1}.score strong{display:block;font-size:24px}.table{background:radial-gradient(ellipse,#215b49,#0e3b31);border:2px solid #426e5e;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}.backs,.hand,.river{display:flex;flex-wrap:wrap;gap:3px;align-items:center;min-height:50px}.backs{justify-content:center}.river{height:84px;align-content:flex-start;overflow:auto;gap:3px}.tile{width:clamp(30px,10vw,47px);height:clamp(43px,14vw,65px);background:#f7f4e8;border:2px solid #b3b6a8;border-bottom-width:5px;border-radius:5px;padding:1px;color:#193a35;display:grid;place-items:center;font-size:28px;line-height:1;flex:none;position:relative}.tile img{width:100%;height:100%;object-fit:contain}.tile.small{width:27px;height:37px;font-size:20px;border-bottom-width:3px}.tile.back{background:linear-gradient(135deg,#1b7385,#154b61);border-color:#e6efea;color:#b7d8df}.tile.pick{border-color:#f0bf5c;transform:translateY(-8px)}.tile.mark{transform:rotate(-90deg) scale(.85)}.tile.glow{outline:3px solid #fd5757;animation:blink .5s alternate infinite}.tile.slot{background:transparent;border:2px dashed white;animation:blink 1s alternate infinite}@keyframes blink{from{opacity:.5}to{opacity:1}}.caption{font-size:12px;color:#bfd9cb}.section{display:flex;justify-content:space-between;align-items:center}.stick{display:inline-block;width:56px;height:12px;background:#e7e1cb;border:1px solid #b2aa88;border-radius:7px;margin-left:6px;vertical-align:middle}.stick:after{content:'';display:block;width:8px;height:8px;border-radius:50%;background:#cc333a;margin:1px auto}.notice{font-size:14px;text-align:center;color:#e9d49c;padding:6px}.overlay{position:fixed;inset:0;background:#051a16e8;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.overlay.show{display:flex}.dialog{max-width:430px;width:100%;max-height:90dvh;overflow:auto;background:#17483e;padding:20px;border:1px solid #c5a86a;border-radius:14px;text-align:center}.winTiles{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin:15px 0}.winTiles .tile{width:35px;height:50px}.hidden{display:none!important}#handArea{justify-content:center}#lobby{margin-top:12px}.room{font-size:26px;font-weight:800;letter-spacing:4px;color:#ffe19e}.last{border-color:#fa5b57!important}.formrow{display:flex;gap:7px}.formrow input{flex:1;min-width:0}@media(max-width:390px){.tile{width:10.4vw;height:14.8vw}.backs .tile{width:8vw;height:11vw}.river{height:84px}.tile.small{width:25px;height:34px}}
</style></head><body><main><header><h1>八牌 <small style="font-size:12px">2人対戦 β</small></h1><a href="./index.html">CPU対戦へ戻る</a></header><section id="lobby" class="panel"><div>同じWi-Fi・離れた場所のどちらでも部屋番号で対戦できます。</div><div class="field"><label for="endpoint">通信サーバーURL（対戦サーバー公開後に設定）</label><input id="endpoint" placeholder="wss://あなたのサーバー.example" autocomplete="url"></div><div class="field"><label for="name">プレイヤー名</label><input id="name" value="プレイヤー" maxlength="16"></div><div class="controls"><button class="btn primary" id="create">部屋を作る</button></div><div class="field"><label for="code">6桁の部屋番号</label><div class="formrow"><input id="code" inputmode="numeric" maxlength="6" placeholder="123456"><button class="btn primary" id="join">参加する</button></div></div><p class="caption">テスト時は対戦サーバー自身のページから開けばURL設定不要です。</p></section><div id="status" role="status">通信待機中</div><section id="game"><div class="scores"><div class="score"><span id="otherName">相手</span><strong id="otherPts">0</strong></div><div class="score"><span id="selfName">あなた</span><strong id="selfPts">0</strong></div></div><div class="section"><span>部屋番号 <span class="room" id="roomCode"></span></span><span id="round">第1局</span></div><div class="table"><div class="caption">相手の手牌</div><div class="backs" id="backs"></div><div class="section caption"><span>相手の捨て牌 <span id="otherStick"></span></span><span>山：<b id="deck">58</b></span></div><div class="river" id="otherRiver"></div><div class="notice" id="turnMessage">対戦待機中</div><div class="section caption"><span>あなたの捨て牌 <span id="selfStick"></span></span></div><div class="river" id="selfRiver"></div><div class="caption">あなたの手牌（同じ牌を素早く2回押して捨てることもできます）</div><div class="hand" id="handArea"></div></div><div class="controls"><button class="btn" id="riichi">リーチ −1点</button><button class="btn primary" id="mainAction">1枚引く</button></div></section></main><div class="overlay" id="overlay"><div class="dialog"><h2 id="dlgTitle">結果</h2><div id="dlgText"></div><div class="winTiles" id="winTiles"></div><div class="controls" style="justify-content:center"><button class="btn primary" id="dlgAction">次へ</button><button class="btn" id="dlgSkip" style="display:none">見送る</button></div></div></div><script type="module">
const $=s=>document.getElementById(s),names={p:'筒',m:'萬'},glyph={p:['🀙','🀚','🀛','🀜','🀝','🀞','🀟','🀠','🀡'],m:['🀇','🀈','🀉','🀊','🀋','🀌','🀍','🀎','🀏']};let ws=null,seat=-1,S=null,selected=-1,lastTap={i:-1,t:0},endShown=false,connectionEnded=false;const urlParam=new URLSearchParams(location.search).get('server');$('endpoint').value=urlParam||localStorage.getItem('hachihai-ws')||((location.protocol==='https:'?'wss://':'ws://')+location.host);
function status(s){$('status').textContent=s}function send(obj){if(ws?.readyState!==WebSocket.OPEN){status('通信が切れています。ページを再読み込みしてください');return;}ws.send(JSON.stringify(obj));}
function connect(kind){const address=$('endpoint').value.trim().replace(/\/$/,'');if(!/^wss?:\/\//.test(address)){status('通信サーバーのURLを ws:// または wss:// で指定してください');return;}if(location.protocol==='https:'&&address.startsWith('ws://')){status('HTTPSからは安全な wss:// 通信が必要です');return;}localStorage.setItem('hachihai-ws',address);status('接続しています…');$('create').disabled=$('join').disabled=true;try{ws=new WebSocket(address);ws.onopen=()=>send({type:kind,name:$('name').value,room:$('code').value.trim()});ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return;}if(m.type==='error'){status('エラー：'+m.message);return;}if(m.type==='notice'){status(m.message);return;}if(m.type==='joined'){seat=m.seat;$('lobby').classList.add('hidden');$('game').style.display='flex';$('roomCode').textContent=m.room;status('部屋へ参加しました。相手を待っています');return;}if(m.type==='state'){S=m;render();return;}};ws.onclose=()=>{connectionEnded=true;status('通信が切断されました。再開するにはページを再読み込みしてください');$('mainAction').disabled=true;$('riichi').disabled=true;};ws.onerror=()=>status('通信サーバーに接続できません。URLとサーバーの稼働状態を確認してください');}catch(e){status('URLを確認してください');$('create').disabled=$('join').disabled=false;}}
$('create').onclick=()=>connect('create');$('join').onclick=()=>connect('join');function tile(t,small=false){let b=document.createElement('button');b.type='button';b.className='tile'+(small?' small':'');b.setAttribute('aria-label',names[t[0]]+t.slice(1));const im=document.createElement('img');im.src='https://raw.githubusercontent.com/FluffyStuff/riichi-mahjong-tiles/master/Export/Regular/'+(t[0]==='p'?'Pin':'Man')+t.slice(1)+'.png';im.alt=names[t[0]]+t.slice(1);im.onerror=()=>{im.remove();b.textContent=glyph[t[0]][Number(t.slice(1))-1];};b.append(im);return b;}
function render(){if(!S)return;const o=1-seat;const mine=S.turn===seat,playing=S.stage==='playing';$('otherName').textContent=S.names[o]||'対戦相手';$('selfName').textContent=S.names[seat]||'あなた';$('otherPts').textContent=S.points[o];$('selfPts').textContent=S.points[seat];$('round').textContent='第'+S.round+'局';$('deck').textContent=S.deckRemaining;$('roomCode').textContent=S.room;const backs=$('backs');backs.replaceChildren();for(let i=0;i<S.opponentCount;i++){let b=document.createElement('div');b.className='tile back';b.textContent='◆';backs.append(b);}for(const [id,idx] of [['selfRiver',seat],['otherRiver',o]]){const river=$(id);river.replaceChildren();S.rivers[idx].forEach((t,i)=>{const b=tile(t,true);b.disabled=true;if(S.riichiMarks[idx]===i)b.classList.add('mark');if(S.discard&&S.discard.by===idx&&i===S.rivers[idx].length-1&&S.phase==='ron')b.classList.add('glow');river.append(b);});}for(const [id,idx] of [['selfStick',seat],['otherStick',o]])$(id).innerHTML=S.riichi[idx]?'<span class="stick" title="リーチ中"></span>':'';const hand=$('handArea');hand.replaceChildren();S.hand.forEach((t,i)=>{const b=tile(t);if(selected===i)b.classList.add('pick');b.disabled=!(playing&&mine&&S.phase==='discard');b.onclick=()=>{if(b.disabled)return;const now=performance.now();if(selected===i&&lastTap.i===i&&now-lastTap.t<430){send({type:'action',action:'discard',index:i});selected=-1;}else{selected=i;lastTap={i,t:now};}render();};hand.append(b);});if(S.hand.length===7){const b=document.createElement('button');b.className='tile slot';b.title='1枚引く';b.disabled=!(playing&&mine&&S.phase==='draw');b.onclick=()=>send({type:'action',action:'draw'});hand.append(b);}let text=S.stage==='waiting'?'相手が入室するのを待っています':S.stage==='ended'?'この局は終了しました':!mine?'相手の番です':S.phase==='ron'?'ロンできます！':S.phase==='draw'?'1枚引いてください':'捨てる牌を選んでください';$('turnMessage').textContent=text;status(S.stage==='waiting'?'部屋番号を相手に教えてください：'+S.room:!connectionEnded?'通信中 · '+text:'通信切断');$('mainAction').textContent=S.phase==='discard'?'選択した牌を捨てる':S.phase==='ron'?'ロン！':'1枚引く';$('mainAction').disabled=!(playing&&mine&&(S.phase==='draw'||S.phase==='ron'||(S.phase==='discard'&&selected>=0)));$('riichi').disabled=!(playing&&mine&&(S.phase==='draw'||S.phase==='discard')&&!S.riichi[seat]);$('riichi').textContent=S.riichi[seat]?'リーチ中':'リーチ −1点';if(S.phase==='ron'&&mine)showRon();else if(S.stage==='ended')showEnd();else{hideDlg();endShown=false;}}
$('mainAction').onclick=()=>{if(!S)return;const a=S.phase==='ron'?'ron':S.phase==='discard'?'discard':'draw';send({type:'action',action:a,index:selected});selected=-1;};$('riichi').onclick=()=>send({type:'action',action:'riichi',index:selected});
function showDlg(title,html,primary,fn,secondary,fn2){$('dlgTitle').textContent=title;$('dlgText').innerHTML=html;$('dlgAction').textContent=primary;$('dlgAction').onclick=fn;$('dlgSkip').style.display=secondary?'block':'none';if(secondary){$('dlgSkip').textContent=secondary;$('dlgSkip').onclick=fn2;}$('overlay').classList.add('show');}
function hideDlg(){$('overlay').classList.remove('show');}
function showRon(){if($('overlay').classList.contains('show'))return;setTimeout(()=>{if(S?.phase==='ron'&&S.turn===seat)showDlg('ロンのチャンス！','相手が捨てた牌でアガれます。','ロン！',()=>send({type:'action',action:'ron'}),'見送る',()=>send({type:'action',action:'pass'}));},1300);}
function showEnd(){if(endShown)return;endShown=true;const f=S.finish,me=f.winner===seat;const title=f.winner===null?'流局':me?'あなたの'+f.kind+'！':'相手の'+f.kind+'！';let html=f.winner===null?'山がなくなりました。':`<p>${me?'おめでとうございます！':'相手がアガりました。'} ${f.earned}点獲得</p><p>基本 ${f.base}点　リーチ ${f.riichi}点　一発 ${f.ippatsu}点　ダブルリーチ ${f.double}点</p><p>${f.bonuses.map(r=>r.name+' ＋'+r.pt+'点').join(' / ')||'役なし'}</p>`;showDlg(title,html,f.matchOver?'再戦する（両者同意）':'次の局へ（両者同意）',()=>{send({type:f.matchOver?'rematch':'next'});hideDlg();});const zone=$('winTiles');zone.replaceChildren();if(f.hand?.length){f.groups.forEach(g=>{const wrap=document.createElement('div');wrap.style.cssText='display:flex;gap:2px;margin:3px';g.forEach(t=>{const b=tile(t,true);b.disabled=true;if(t===f.winTile)b.classList.add('last');wrap.append(b);});zone.append(wrap);});}}
</script></body></html>
